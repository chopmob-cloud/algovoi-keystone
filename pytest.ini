[pytest]
# An ini file here makes this directory the rootdir for any invocation, so the
# repo-root conftest.py always runs and pins imports to the source tree. Without
# it, `pytest control` resolves rootdir to control/ and the pin never happens.
testpaths =
    packages
    plugins
    adapters
    control
    tests
addopts = --no-header -p no:cacheprovider
