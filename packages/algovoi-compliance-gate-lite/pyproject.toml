[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-compliance-gate-lite"
version = "0.4.0"
description = "Open, content-addressed compliance-gate decisions bound to the pinned AlgoVoi substrate (ALLOW/REFER/DENY; no-PII; L1 frozen)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["jcs", "rfc8785", "compliance", "sanctions", "aml", "no-pii", "agentic-payments", "algovoi"]
dependencies = ["algovoi-substrate>=0.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "rfc8785>=0.1.2"]

[project.urls]
"Conformance vectors" = "https://github.com/chopmob-cloud/algovoi-jcs-conformance-vectors"
"Commercial Compliance Gate" = "https://docs.algovoi.co.uk/compliance-gate-v2"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_compliance_gate_lite*"]

[project.entry-points."algovoi.keystone.steps"]
screen = "algovoi_compliance_gate_lite.keystone:keystone_step"
