[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-cancellation-receipt-lite"
version = "0.5.0"
description = "Open, content-addressed cancellation references bound into the pinned AlgoVoi substrate (mandate_ref + cancellation reason; closes the spend-authority lifecycle; L1 frozen)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["jcs", "rfc8785", "cancellation-receipt", "spend-authority", "agentic-payments", "algovoi"]
dependencies = ["algovoi-substrate>=0.4.0"]

requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "rfc8785>=0.1.4"]

[project.urls]
Homepage = "https://www.algovoi.co.uk"
Repository = "https://github.com/chopmob-cloud/algovoi-keystone"
Documentation = "https://docs.algovoi.co.uk"
"Conformance vectors" = "https://github.com/chopmob-cloud/algovoi-jcs-conformance-vectors"
"Commercial Cancellation Receipt" = "https://docs.algovoi.co.uk/cancellation-receipt"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_cancellation_receipt_lite*"]

[project.entry-points."algovoi.keystone.steps"]
cancellation = "algovoi_cancellation_receipt_lite.keystone:keystone_step"
