[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-policy-binding"
version = "0.4.0"
description = "Additive policy-snapshot binding for the AlgoVoi substrate (version-provable, rotation-detectable; L1 frozen)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["jcs", "rfc8785", "policy", "audit", "tamper-evident", "agentic-payments", "algovoi"]
dependencies = ["rfc8785>=0.1.4"]

requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.urls]
Homepage = "https://www.algovoi.co.uk"
Repository = "https://github.com/chopmob-cloud/algovoi-keystone"
Documentation = "https://docs.algovoi.co.uk"
"Conformance vectors" = "https://github.com/chopmob-cloud/algovoi-jcs-conformance-vectors"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_policy_binding*"]

[project.entry-points."algovoi.keystone.steps"]
policy_bound = "algovoi_policy_binding.keystone:keystone_step"
