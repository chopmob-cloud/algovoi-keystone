[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-delegation-ref"
version = "0.4.0"
description = "Content-addressed delegation references for the AlgoVoi substrate (tamper-evident, chainable; L1 frozen)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["jcs", "rfc8785", "delegation", "authority", "tamper-evident", "agentic-payments", "algovoi"]
dependencies = ["algovoi-substrate>=0.4.0", "rfc8785>=0.1.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.urls]
"Conformance vectors" = "https://github.com/chopmob-cloud/algovoi-jcs-conformance-vectors"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_delegation_ref*"]

[project.entry-points."algovoi.keystone.steps"]
delegation = "algovoi_delegation_ref.keystone:keystone_step"
