[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-recompute-drift"
version = "0.4.1"
description = "Offline recompute-drift detection for the AlgoVoi action_ref (RFC 8785 JCS + integer-ms; L1 frozen)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["jcs", "rfc8785", "action-ref", "recompute", "drift", "tamper-evident", "agentic-payments", "algovoi"]
dependencies = ["algovoi-substrate>=0.4.0", "rfc8785>=0.1.4"]

requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.urls]
Homepage = "https://www.algovoi.co.uk"
Repository = "https://github.com/chopmob-cloud/algovoi-keystone"
Documentation = "https://docs.algovoi.co.uk"
"Conformance vectors" = "https://github.com/chopmob-cloud/algovoi-jcs-conformance-vectors"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_recompute_drift*"]
