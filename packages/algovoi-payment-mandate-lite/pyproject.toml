[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-payment-mandate-lite"
version = "0.5.0"
description = "Open, content-addressed spend-authority references bound into the pinned AlgoVoi substrate (payer + cap + period + revocation state; L1 frozen)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["jcs", "rfc8785", "payment-mandate", "spend-authority", "agentic-payments", "algovoi"]
dependencies = ["algovoi-substrate>=0.4.0"]

requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "rfc8785>=0.1.4"]

[project.urls]
Homepage = "https://www.algovoi.co.uk"
Repository = "https://github.com/chopmob-cloud/algovoi-keystone"
Documentation = "https://docs.algovoi.co.uk"
"Conformance vectors" = "https://github.com/chopmob-cloud/algovoi-jcs-conformance-vectors"
"Commercial Payment Mandate" = "https://docs.algovoi.co.uk/concepts/mandates"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_payment_mandate_lite*"]

[project.entry-points."algovoi.keystone.steps"]
mandate = "algovoi_payment_mandate_lite.keystone:keystone_step"
