[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-keystone-connect"
version = "0.5.0"
description = "Build and test Keystone bolt-ons with almost no boilerplate -- declare a connector in ~12 lines and verify any bolt-on at any stage of the flow offline (keystone toolkit, Apache-2.0)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["keystone", "bolt-on", "connector", "execution_ref", "conformance", "jcs", "rfc8785", "agentic-payments", "algovoi"]
requires-python = ">=3.10"
dependencies = ["algovoi-execution-ref>=0.4.0", "rfc8785>=0.1.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_keystone_connect*"]

[project.urls]
Homepage = "https://www.algovoi.co.uk"
Repository = "https://github.com/chopmob-cloud/algovoi-keystone"
Documentation = "https://docs.algovoi.co.uk"
