[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-keystone-langchain"
version = "0.1.0"
description = "Carry an AlgoVoi keystone decision into a LangChain run trace: a recomputable execution_ref under algovoi.keystone.*, verifiable offline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["langchain", "langsmith", "agent", "tracing", "observability", "keystone", "execution_ref", "jcs", "rfc8785", "algovoi"]
dependencies = ["algovoi-substrate>=0.4.0", "rfc8785>=0.1.2"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/keystone"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_keystone_langchain*"]
